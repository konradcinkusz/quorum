name: secret-scan

# P5 is enforced by a scanner, not by review. Every credential this repository has ever
# leaked passed a human read at the time — including one that sat in a `// Password@123`
# comment directly above the hash it described, which is exactly the shape a reader's eye
# slides over and a scanner does not.
#
# See docs/architecture/00-SECURITY-IMMEDIATE.md.

on:
  # Only the default branch on push. Every other branch is covered by pull_request, and
  # listening to both fired two identical runs per push to a PR branch — doubling queue
  # time and Actions minutes for no extra signal.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded commit's run tells you nothing. Cancel it and keep the queue for the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. Scanning only the checked-out tip would have reported this
          # repository clean while a live API secret sat in commit f0fca15.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A broken config makes gitleaks exit 1 *before scanning anything*, which in the
      # checks list is indistinguishable from "leaks found". That is how this workflow
      # spent two weeks failing open: .gitleaks.toml acquired a UTF-8 BOM in 546b480, and
      # the only symptom was `invalid character at start of key: ï` — a TOML parser error
      # naming neither the file nor the cause. See issue #24.
      #
      # This step exists to make that specific failure diagnose itself. It cannot stop a
      # human merging past a red check; only branch protection does that.
      - name: Validate the gitleaks config
        run: |
          set -euo pipefail

          if [ "$(head -c 3 .gitleaks.toml | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
            echo "::error file=.gitleaks.toml::.gitleaks.toml begins with a UTF-8 BOM. gitleaks' TOML parser rejects it and the scan never runs. Strip the BOM (the file must start with '#')."
            exit 1
          fi

          # Parse the config against an empty directory, so this step can fail for exactly
          # one reason: the config. A findings-driven failure is impossible here.
          mkdir -p /tmp/gitleaks-config-check
          if ! gitleaks dir /tmp/gitleaks-config-check --config .gitleaks.toml 2>/tmp/config-check.err; then
            echo "::error file=.gitleaks.toml::.gitleaks.toml did not load. gitleaks said:"
            cat /tmp/config-check.err
            exit 1
          fi
          echo ".gitleaks.toml parses; the scans below will actually run."

      # The upstream binary is used directly rather than gitleaks-action, which requires a
      # paid licence key for organisation-owned repositories. gitleaks itself is MIT.
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

      - name: Scan git history
        # Known historical leaks are listed in .gitleaks.toml's allowlist with the reason
        # and the rotation status, so this step fails on anything NEW rather than failing
        # permanently on what is already recorded and being dealt with.
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
